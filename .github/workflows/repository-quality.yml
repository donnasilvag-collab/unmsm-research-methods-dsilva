name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 05_pipeline/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r 05_pipeline/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q 05_pipeline 11_bias_audit

      - name: Reproduce synthetic fieldwork scoring
        working-directory: 05_pipeline
        run: |
          python src/generate_synthetic_fieldwork.py
          python src/score_fieldwork.py --input fieldwork/synthetic/survey_responses_synthetic.csv --output-dir fieldwork/synthetic --synthetic
          python src/generate_synthetic_analysis.py
          python src/score_fieldwork.py --input fieldwork/synthetic/association_demo/survey_responses_analysis_synthetic.csv --output-dir fieldwork/synthetic/association_demo --synthetic
          python src/analyze_synthetic_fieldwork.py --synthetic

      - name: Validate research records and Markdown
        run: python 05_pipeline/src/validate_repository.py

      - name: Reproduce DVC data stage
        working-directory: 05_pipeline
        run: dvc repro

      - name: Reproduce MLflow experiment summaries
        working-directory: 05_pipeline
        run: python src/run_experiments.py

      - name: Reproduce bias audit
        run: python 11_bias_audit/bias_audit.py

      - name: Compare reproducible numerical outputs
        run: >-
          git diff --exit-code --
          05_pipeline/dvc.lock
          05_pipeline/results/benchmark_summary_seed_13.csv
          05_pipeline/results/benchmark_summary_seed_21.csv
          05_pipeline/results/benchmark_summary_seed_42.csv
          05_pipeline/results/benchmark_summary_seed_87.csv
          05_pipeline/results/seed_stability.csv
          05_pipeline/fieldwork/synthetic/survey_responses_synthetic.csv
          05_pipeline/fieldwork/synthetic/scored_responses_synthetic.csv
          05_pipeline/fieldwork/synthetic/organization_summary_synthetic.csv
          05_pipeline/fieldwork/synthetic/item_missingness_synthetic.csv
          05_pipeline/fieldwork/synthetic/scoring_metadata_synthetic.json
          05_pipeline/fieldwork/synthetic/association_demo/survey_responses_analysis_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/integration_evidence_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/scored_responses_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/organization_summary_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/item_missingness_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/scoring_metadata_synthetic.json
          05_pipeline/fieldwork/synthetic/association_demo/spearman_correlations_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/exploratory_regressions_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/regression_diagnostics_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/integration_joint_display_synthetic.csv
          05_pipeline/fieldwork/synthetic/association_demo/analysis_report_synthetic.md
          05_pipeline/fieldwork/synthetic/association_demo/analysis_metadata_synthetic.json
          11_bias_audit/bias_audit_splits.csv
          11_bias_audit/owner_influence_diagnostics.csv
          11_bias_audit/bias_audit_summary.csv
